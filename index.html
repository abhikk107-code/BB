<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BB AI Assistant</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0f19;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #141b2d;
      border: 1px solid #26314d;
      border-radius: 20px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .lang-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .lang-btn {
      width: auto;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #26314d;
    }
    .lang-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    h1 { margin: 0 0 6px; font-size: 24px; color: #38bdf8; }
    p.sub { margin: 0 0 18px; font-size: 13px; color: #94a3b8; }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus {
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    button:active {
      transform: scale(0.99);
    }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-on { background: #16a34a; color: #fff; }
    .btn-off { background: #dc2626; color: #fff; }
    .orb {
      width: 104px;
      height: 104px;
      margin: 16px auto;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8, #1d4ed8);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
      transition: 0.3s;
    }
    .orb.active {
      background: radial-gradient(circle, #4ade80, #15803d);
      box-shadow: 0 0 35px rgba(74, 222, 128, 0.7);
      transform: scale(1.06);
    }
    .orb.listening {
      box-shadow: 0 0 46px rgba(56, 189, 248, 0.95);
      transform: scale(1.13);
    }
    .status {
      font-size: 14px;
      margin: 10px 0 14px;
      color: #cbd5e1;
      min-height: 20px;
    }
    .log-box {
      margin-top: 16px;
      background: #0f172a;
      border-radius: 12px;
      padding: 12px;
      text-align: left;
      font-size: 14px;
      height: 145px;
      overflow-y: auto;
      border: 1px solid #1e293b;
    }
    .log-item {
      margin-top: 6px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .log-item:first-child {
      margin-top: 0;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- PIN Lock Screen -->
  <div class="card" id="lockScreen">
    <div class="lang-bar">
      <button type="button" class="lang-btn active" data-lang="en" onclick="setLanguage('en')">English</button>
      <button type="button" class="lang-btn" data-lang="hi" onclick="setLanguage('hi')"></button>
      <button type="button" class="lang-btn" data-lang="hinglish" onclick="setLanguage('hinglish')">Hinglish</button>
    </div>

    <h1 id="lockTitle">BB Control Lock</h1>
    <p class="sub" id="lockSub">Enter your private PIN (default: 1234)</p>
    <input type="password" inputmode="numeric" id="pinInput" placeholder="Enter PIN" maxlength="8" />
    <button type="button" class="btn-primary" id="unlockBtn" onclick="unlockApp()">Unlock</button>
    <p class="status" id="pinError" style="color:#f87171;"></p>
  </div>

  <!-- Main BB Assistant Screen -->
  <div class="card hidden" id="appScreen">
    <div class="lang-bar">
      <button type="button" class="lang-btn active" data-lang="en" onclick="setLanguage('en')">English</button>
      <button type="button" class="lang-btn" data-lang="hi" onclick="setLanguage('hi')"></button>
      <button type="button" class="lang-btn" data-lang="hinglish" onclick="setLanguage('hinglish')">Hinglish</button>
    </div>

    <h1 id="appTitle">BB Assistant</h1>
    <p class="sub" id="appSub">Your personal voice assistant</p>

    <div class="orb" id="orb"></div>
    <div class="status" id="statusText">BB is currently OFF</div>

    <button type="button" class="btn-on" id="powerBtn" onclick="toggleBB()">Turn BB ON</button>

    <div class="log-box" id="chatLog"></div>
  </div>

  <script>
    const OWNER_PIN = "1234";
    const STORAGE_KEY = "bb_assistant_lang";

    const I18N = {
      en: {
        htmlLang: "en",
        speechLang: "en-US",
        lockTitle: "BB Control Lock",
        lockSub: "Enter your private PIN (default: 1234)",
        pinPlaceholder: "Enter PIN",
        unlockBtn: "Unlock",
        wrongPin: "Incorrect PIN! Only the owner can unlock.",
        appTitle: "BB Assistant",
        appSub: "Your personal voice assistant",
        bbName: "BB",
        userName: "You",
        readyLog: "System is ready. Turn BB ON to start talking.",
        offStatus: "BB is currently OFF",
        onStatus: "BB is ON  Speak anytime",
        listeningStatus: "Listening... Speak now",
        micBlockedError: "Microphone permission blocked or unavailable.",
        turnOnBtn: "Turn BB ON",
        turnOffBtn: "Turn BB OFF",
        onlineReply: "BB is online. Listening now, tell me what to do.",
        offReply: "System has been turned off.",
        noSpeechSupport: "Voice recognition is not supported in this browser. Please use Google Chrome.",
        wakeReply: "Yes, I am listening! What should I do?",
        greetingReply: "Hello! I am BB, ready to help you.",
        timePrefix: "Current time is ",
        youtubeReply: "Opening YouTube.",
        googleReply: "Opening Google.",
        fallbackPrefix: "You said: ",
        fallbackSuffix: ". I am still learning this."
      },
      hi: {
        htmlLang: "hi",
        speechLang: "hi-IN",
        lockTitle: "BB  ",
        lockSub: "  PIN  (: 1234)",
        pinPlaceholder: "PIN ",
        unlockBtn: " ",
        wrongPin: " PIN!      ",
        appTitle: "BB Assistant",
        appSub: "   ",
        bbName: "BB",
        userName: "",
        readyLog: "        BB  ON ",
        offStatus: "BB  OFF ",
        onStatus: "BB ON    ",
        listeningStatus: "  ... ",
        micBlockedError: "        ",
        turnOnBtn: "BB  ON ",
        turnOffBtn: "BB  OFF ",
        onlineReply: "BB      ,    ?",
        offReply: "     ",
        noSpeechSupport: "        Google Chrome  ",
        wakeReply: ",    !   ?",
        greetingReply: "!  BB ,     ",
        timePrefix: "   ",
        youtubeReply: "YouTube   ",
        googleReply: "Google   ",
        fallbackPrefix: " : ",
        fallbackSuffix: "     "
      },
      hinglish: {
        htmlLang: "en-IN",
        speechLang: "hi-IN",
        lockTitle: "BB Control Lock",
        lockSub: "Apna private PIN enter karein (default: 1234)",
        pinPlaceholder: "PIN enter karein",
        unlockBtn: "Unlock Karein",
        wrongPin: "Galat PIN! Sirf owner hi unlock kar sakta hai.",
        appTitle: "BB Assistant",
        appSub: "Aapka personal voice assistant",
        bbName: "BB",
        userName: "Aap",
        readyLog: "System ready hai. Baat shuru karne ke liye BB ko ON karein.",
        offStatus: "BB abhi OFF hai",
        onStatus: "BB ON hai  seedha bolein",
        listeningStatus: "Sun raha hoon... boliye",
        micBlockedError: "Mic permission block hai ya available nahi hai.",
        turnOnBtn: "BB ko ON Karein",
        turnOffBtn: "BB ko OFF Karein",
        onlineReply: "BB online hai. Sun raha hoon, bataiye kya karna hai?",
        offReply: "System OFF kar diya gaya hai.",
        noSpeechSupport: "Is browser mein voice recognition support nahi hai. Google Chrome use karein.",
        wakeReply: "Haan, main sun raha hoon! Bataiye kya karoon?",
        greetingReply: "Hello! Main BB hoon, aapki help ke liye ready hoon.",
        timePrefix: "Abhi time hua hai ",
        youtubeReply: "YouTube open kar raha hoon.",
        googleReply: "Google open kar raha hoon.",
        fallbackPrefix: "Aapne kaha: ",
        fallbackSuffix: ". Main isko seekh raha hoon."
      }
    };

    let currentLang = localStorage.getItem(STORAGE_KEY) || "en";
    if (!I18N[currentLang]) currentLang = "en";

    let isBBOn = false;
    let isListening = false;
    let restartTimer = null;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;

    function t() {
      return I18N[currentLang];
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function addLog(sender, msg) {
      const box = document.getElementById("chatLog");
      const item = document.createElement("div");
      item.className = "log-item";
      item.innerHTML = `<strong>${escapeHtml(sender)}:</strong> ${escapeHtml(msg)}`;
      box.appendChild(item);
      box.scrollTop = box.scrollHeight;
    }

    function clearRestartTimer() {
      if (restartTimer) {
        clearTimeout(restartTimer);
        restartTimer = null;
      }
    }

    function scheduleRestart(delay = 450) {
      clearRestartTimer();
      if (!isBBOn || !recognition) return;
      restartTimer = setTimeout(() => {
        if (isBBOn && !isListening) {
          startListening();
        }
      }, delay);
    }

    if (recognition) {
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById("orb").classList.add("listening");
        document.getElementById("statusText").innerText = t().listeningStatus;
      };

      recognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            const transcript = event.results[i][0].transcript.trim();
            if (transcript) {
              processCommand(transcript);
            }
          }
        }
      };

      recognition.onerror = (event) => {
        isListening = false;
        document.getElementById("orb").classList.remove("listening");

        if (!isBBOn) return;

        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          document.getElementById("statusText").innerText = t().micBlockedError;
          return;
        }

        document.getElementById("statusText").innerText = t().onStatus;
        scheduleRestart(700);
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById("orb").classList.remove("listening");
        if (isBBOn) {
          document.getElementById("statusText").innerText = t().onStatus;
          scheduleRestart(350);
        }
      };
    }

    function setLanguage(lang) {
      if (!I18N[lang]) return;
      currentLang = lang;
      localStorage.setItem(STORAGE_KEY, lang);
      document.documentElement.lang = t().htmlLang;

      if (recognition) {
        recognition.lang = t().speechLang;
      }

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });

      document.getElementById("lockTitle").innerText = t().lockTitle;
      document.getElementById("lockSub").innerText = t().lockSub;
      document.getElementById("pinInput").placeholder = t().pinPlaceholder;
      document.getElementById("unlockBtn").innerText = t().unlockBtn;

      document.getElementById("appTitle").innerText = t().appTitle;
      document.getElementById("appSub").innerText = t().appSub;

      const powerBtn = document.getElementById("powerBtn");
      const statusEl = document.getElementById("statusText");

      if (isBBOn) {
        powerBtn.innerText = t().turnOffBtn;
        statusEl.innerText = isListening ? t().listeningStatus : t().onStatus;
      } else {
        powerBtn.innerText = t().turnOnBtn;
        statusEl.innerText = t().offStatus;
      }

      const logBox = document.getElementById("chatLog");
      if (logBox.children.length === 0) {
        addLog(t().bbName, t().readyLog);
      }
    }

    function unlockApp() {
      const entered = document.getElementById("pinInput").value.trim();
      const errorEl = document.getElementById("pinError");

      if (entered === OWNER_PIN) {
        errorEl.innerText = "";
        document.getElementById("pinInput").value = "";
        document.getElementById("lockScreen").classList.add("hidden");
        document.getElementById("appScreen").classList.remove("hidden");
      } else {
        errorEl.innerText = t().wrongPin;
      }
    }

    function speak(text) {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = t().speechLang;
        window.speechSynthesis.speak(utter);
      }
    }

    function toggleBB() {
      isBBOn = !isBBOn;
      const btn = document.getElementById("powerBtn");
      const orb = document.getElementById("orb");
      const status = document.getElementById("statusText");

      clearRestartTimer();

      if (isBBOn) {
        btn.innerText = t().turnOffBtn;
        btn.className = "btn-off";
        orb.classList.add("active");
        status.innerText = t().listeningStatus;

        if (!recognition) {
          alert(t().noSpeechSupport);
          return;
        }

        addLog(t().bbName, t().onlineReply);
        speak(t().onlineReply);
        startListening();
      } else {
        btn.innerText = t().turnOnBtn;
        btn.className = "btn-on";
        orb.classList.remove("active", "listening");
        status.innerText = t().offStatus;

        if (recognition) {
          try {
            recognition.abort();
          } catch (e) {}
        }
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
        addLog(t().bbName, t().offReply);
      }
    }

    function processCommand(rawText) {
      const text = rawText.toLowerCase().trim();
      addLog(t().userName, rawText);

      const cleanCmd = text
        .replace(/\bhey bb\b/gi, "")
        .replace(/\bhe bb\b/gi, "")
        .replace(/\bhi bb\b/gi, "")
        .replace(/ /g, "")
        .replace(/ /g, "")
        .trim();

      let reply = "";

      if (cleanCmd === "" && (text.includes("bb") || text.includes(""))) {
        reply = t().wakeReply;
      } else if (
        cleanCmd.includes("hello") ||
        cleanCmd.includes("hi") ||
        cleanCmd.includes("hey") ||
        cleanCmd.includes("") ||
        cleanCmd.includes("namaste")
      ) {
        reply = t().greetingReply;
      } else if (
        cleanCmd.includes("time") ||
        cleanCmd.includes("") ||
        cleanCmd.includes("kitne baje")
      ) {
        const locale = currentLang === "hi" ? "hi-IN" : "en-IN";
        const now = new Date().toLocaleTimeString(locale, {
          hour: "2-digit",
          minute: "2-digit"
        });
        reply = t().timePrefix + now;
      } else if (cleanCmd.includes("youtube") || cleanCmd.includes("")) {
        reply = t().youtubeReply;
        window.open("https://m.youtube.com", "_blank", "noopener,noreferrer");
      } else if (cleanCmd.includes("google") || cleanCmd.includes("")) {
        reply = t().googleReply;
        window.open("https://www.google.com", "_blank", "noopener,noreferrer");
      } else {
        reply = t().fallbackPrefix + rawText + t().fallbackSuffix;
      }

      addLog(t().bbName, reply);
      speak(reply);
    }

    function startListening() {
      if (!isBBOn || !recognition || isListening) return;

      recognition.lang = t().speechLang;
      try {
        recognition.start();
      } catch (err) {
        scheduleRestart(600);
      }
    }

    document.getElementById("pinInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        unlockApp();
      }
    });

    setLanguage(currentLang);
  </script>
</body>
</html>
